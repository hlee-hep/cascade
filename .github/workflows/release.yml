name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        shell: micromamba-shell {0}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cascade-release
          create-args: >-
            python=3.14
            root_base=6.40
            cxx-compiler
            pkg-config
            scons
            pybind11
            pyyaml
            yaml-cpp
            nlohmann_json
            openssl
          cache-environment: true
          cache-environment-key: cascade-release-root640-py314
          post-cleanup: all

      - name: Validate release inputs
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          grep -Fq "# Cascade $version" "docs/releases/$GITHUB_REF_NAME.md"

      - name: Build release runtime and benchmark executables
        run: |
          scons -j2 \
            test-runtime \
            build/benchmarks/cascade-dag-bench \
            build/benchmarks/cascade-input-hash-bench \
            build/benchmarks/cascade-output-hash-bench

      - name: Stage a clean release runtime
        run: |
          python scripts/stage_runtime.py --output "$RUNNER_TEMP/cascade-runtime"

      - name: Check staged runtime version
        run: |
          export PYTHONPATH="$RUNNER_TEMP/cascade-runtime/lib"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/cascade-runtime/lib:${LD_LIBRARY_PATH:-}"
          python scripts/check_runtime_version.py --tag "$GITHUB_REF_NAME"

      - name: Capture release benchmark baseline
        run: |
          baseline="$RUNNER_TEMP/cascade-benchmark"
          mkdir -p "$baseline"

          build/benchmarks/cascade-dag-bench \
            --nodes 1,10,100,1000 \
            --iterations 9 \
            --workers 1,2,4 \
            --json > "$baseline/dag.json"

          build/benchmarks/cascade-input-hash-bench \
            --fixture-mib 128 \
            --iterations 9 \
            --json > "$baseline/input-hash.json"

          build/benchmarks/cascade-output-hash-bench \
            --fixture-mib 128 \
            --iterations 9 \
            --json > "$baseline/output-hash.json"

          python scripts/collect_benchmark_metadata.py \
            --output "$baseline/metadata.json" \
            --dag "$baseline/dag.json" \
            --input-hash "$baseline/input-hash.json" \
            --output-hash "$baseline/output-hash.json"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_args=()
          if [[ "$version" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP"/cascade-benchmark/*.json \
            --verify-tag \
            "${release_args[@]}" \
            --title "Cascade $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
