name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cascade:
    name: ROOT ${{ matrix.root }} / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - root: "6.32"
            python: "3.11"
            cache_key: root632-py311
          - root: "6.34"
            python: "3.12"
            cache_key: root634-py312
          - root: "6.40"
            python: "3.14"
            cache_key: root640-py314

    defaults:
      run:
        shell: micromamba-shell {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create ROOT environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cascade-ci
          create-args: >-
            python=${{ matrix.python }}
            root_base=${{ matrix.root }}
            cxx-compiler
            pkg-config
            scons
            pybind11
            pyyaml
            yaml-cpp
            nlohmann_json
            openssl
          cache-environment: true
          cache-environment-key: cascade-${{ matrix.cache_key }}
          post-cleanup: all

      - name: Isolate Cascade configuration
        run: |
          config_file="$RUNNER_TEMP/cascade-config/config.json"
          echo "CASCADE_CONFIG_FILE=$config_file" >> "$GITHUB_ENV"

      - name: Show dependency versions
        run: |
          python --version
          root-config --version
          root-config --cflags
          c++ --version
          pkg-config --modversion yaml-cpp
          python -m pybind11 --includes
          scons --version
          openssl version

      - name: Build Cascade
        run: scons -j2

      - name: Run C++ and Python verification
        run: scons verify -j2

      # SConstruct currently starts each tests/test_*.py file in a separate
      # interpreter. This additional pass is what detects sys.modules leakage
      # between test modules.
      - name: Run Python tests in one interpreter
        run: |
          export CASCADE_CACHE_DIR="$RUNNER_TEMP/cascade-unified-test-cache"
          export CASCADE_CPP_WORKER="$PWD/build/bin/cascade-worker"
          export CASCADE_PYTHON_WORKER="$PWD/build/bin/cascade-python-worker"
          export CASCADE_PYTHON_RUNTIME_DIR="$PWD/build/test-runtime"
          export CASCADE_PLUGIN_DIR="$PWD/build/test-plugins"
          export CASCADE_PYPLUGIN_DIR="$PWD/build/test-plugins"
          export CASCADE_TEST_ASSERT_ISOLATED_PYTHON=1
          export PYTHONPATH="$PWD/build/test-runtime"
          export TMPDIR="$RUNNER_TEMP"
          export LD_LIBRARY_PATH="$PWD/build/src:$PWD/build/utils:$PWD/build/AnalysisManager:$PWD/build/ParamManager:$PWD/build/PlotManager:$PWD/build/main:${LD_LIBRARY_PATH:-}"

          python -m unittest -v tests/test_*.py

      - name: Install Cascade
        run: |
          cascade_prefix="$RUNNER_TEMP/cascade-prefix"
          scons install -j2 PREFIX="$cascade_prefix"

          echo "CASCADE_PREFIX=$cascade_prefix" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$cascade_prefix/lib" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$cascade_prefix/lib" >> "$GITHUB_ENV"
          echo "$cascade_prefix/bin" >> "$GITHUB_PATH"

      - name: Check installed runtime
        run: |
          python -c 'import cascade; assert cascade.__version__ == "0.3.0"; assert cascade.__abi_version__ == 3; print(cascade.__version__, cascade.__abi_version__, cascade.__abi_tag__)'
          cascade doctor runtime --json

      - name: Install and verify toy dimuon plugin
        run: |
          plugin_prefix="$RUNNER_TEMP/cascade-plugins"

          cascade plugin install \
            examples/plugins/toy_dimuon_analysis \
            --prefix "$plugin_prefix"

          cascade plugin path list
          cascade doctor plugins --json
          cascade module list

      - name: Run toy analysis and verify cache reuse
        working-directory: examples/plugins/toy_dimuon_analysis
        run: |
          set -o pipefail

          output="$RUNNER_TEMP/toy-dimuon-output"

          python run_analysis.py \
            --isolated \
            --output "$output" \
            | tee "$RUNNER_TEMP/toy-first.log"

          test "$(grep -Ec '^(generate|spectrum|fit|report): .*Done' "$RUNNER_TEMP/toy-first.log")" -eq 4

          test -s "$output/toy_dimuons.root"
          test -s "$output/dimuon_spectrum.root"
          test -s "$output/dimuon_fit.root"
          test -s "$output/dimuon_fit.png"
          test -s "$output/analysis_summary.json"
          test -s "$output/dimuon_report.md"

          python run_analysis.py \
            --isolated \
            --output "$output" \
            | tee "$RUNNER_TEMP/toy-second.log"

          test "$(grep -Ec '^(generate|spectrum|fit|report): .*Skipped' "$RUNNER_TEMP/toy-second.log")" -eq 4

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    defaults:
      run:
        shell: micromamba-shell {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create sanitizer environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cascade-sanitizers
          create-args: >-
            python=3.11
            root_base=6.32
            cxx-compiler
            pkg-config
            scons
            pybind11
            pyyaml
            yaml-cpp
            nlohmann_json
            openssl
          cache-environment: true
          cache-environment-key: cascade-sanitizers-root632-py311
          post-cleanup: all

      - name: Run verification with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:handle_segv=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          CASCADE_CONFIG_FILE: ${{ runner.temp }}/cascade-sanitizer-config/config.json
        run: scons verify -j2 SANITIZERS=address,undefined

  benchmarks:
    name: Benchmark baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: micromamba-shell {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create benchmark environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: cascade-benchmarks
          create-args: >-
            python=3.11
            root_base=6.32
            cxx-compiler
            pkg-config
            scons
            pybind11
            pyyaml
            yaml-cpp
            nlohmann_json
            openssl
          cache-environment: true
          cache-environment-key: cascade-benchmarks-root632-py311
          post-cleanup: all

      - name: Build benchmark executables
        run: |
          scons -j2 \
            build/benchmarks/cascade-dag-bench \
            build/benchmarks/cascade-input-hash-bench \
            build/benchmarks/cascade-output-hash-bench

      - name: Capture benchmark baseline
        run: |
          baseline="$RUNNER_TEMP/cascade-benchmark"
          mkdir -p "$baseline"

          build/benchmarks/cascade-dag-bench \
            --nodes 1,10,100,1000 \
            --iterations 9 \
            --workers 1,2,4 \
            --json > "$baseline/dag.json"

          build/benchmarks/cascade-input-hash-bench \
            --fixture-mib 128 \
            --iterations 9 \
            --json > "$baseline/input-hash.json"

          build/benchmarks/cascade-output-hash-bench \
            --fixture-mib 128 \
            --iterations 9 \
            --json > "$baseline/output-hash.json"

          python scripts/collect_benchmark_metadata.py \
            --output "$baseline/metadata.json" \
            --dag "$baseline/dag.json" \
            --input-hash "$baseline/input-hash.json" \
            --output-hash "$baseline/output-hash.json"

      - name: Upload benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: cascade-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/cascade-benchmark/*.json
          if-no-files-found: error
          retention-days: 90
